<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Falling sand</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0e14; --panel: #151a24; --line: #2a3142; --fg: #e6e9f0; --dim: #8a93a6; --accent: #6ea8ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.3 system-ui, sans-serif; overflow-x: hidden; }
    body { display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    header .readme { color: var(--accent); font-size: 12px; text-decoration: none; }
    header .info { margin-left: auto; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
    main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px; }
    #stage { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
    canvas { touch-action: none; display: block; image-rendering: pixelated; background: #000; cursor: crosshair; }
    footer { border-top: 1px solid var(--line); background: var(--panel); padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
    #palette { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
    #palette button { flex: 0 0 auto; min-width: 72px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #0f131b; color: var(--fg); border: 2px solid var(--line); border-radius: 8px; font: inherit; font-size: 12px; padding: 4px 8px; cursor: pointer; }
    #palette button[aria-pressed="true"] { border-color: var(--accent); background: #17202f; }
    .sw { width: 28px; height: 16px; border-radius: 3px; border: 1px solid rgba(255,255,255,.25); }
    .brush { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 13px; }
    .brush input { flex: 1; max-width: 260px; height: 28px; }
    .brush output { min-width: 2ch; color: var(--fg); }
    #note { color: #ffb86e; font-size: 12px; padding: 2px 12px; }
    header nav { display: flex; gap: 10px; font-size: 12px; }
    header nav a { color: var(--dim); text-decoration: none; }
    header nav a[aria-current="page"] { color: var(--fg); }
    #stage { position: relative; }
    #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #labels > span { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); font-size: 11px; line-height: 1; padding: 2px 4px; border-radius: 3px; background: rgba(11,14,20,.72); color: #fff; white-space: nowrap; }
    #labels > span { display: flex; flex-direction: column; align-items: stretch; gap: 2px; }
    #labels > span.dead { color: #7d8496; background: rgba(11,14,20,.5); text-decoration: line-through; }
    #labels .hpbar { display: block; height: 3px; background: #1b2231; border-radius: 2px; overflow: hidden; }
    #labels .hpbar b { display: block; height: 100%; width: 100%; }
    #labels > span.me { background: rgba(110,168,255,.85); color: #0b0e14; }
    #zoom { position: absolute; right: 8px; top: 34px; display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--dim); background: rgba(15,19,27,.82); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; }
    #zoom[hidden] { display: none; }
    #zoom button { width: 26px; height: 26px; font: inherit; font-size: 16px; line-height: 1; background: #0f131b; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
    #zoom button:disabled { opacity: .35; cursor: default; }
    #zoom span { min-width: 22px; text-align: center; }
    #hud { position: absolute; left: 8px; bottom: 8px; width: 120px; pointer-events: none; font-size: 11px; color: var(--dim); }
    #hud .bar { height: 6px; background: #1b2231; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; margin-top: 3px; }
    #hud .bar.hp { margin-bottom: 0; }
    #hud span + .bar + span { display: block; margin-top: 6px; }
    #hud .bar i { display: block; height: 100%; width: 100%; background: #6ea8ff; }
    #spells { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: none; }
    #spells[hidden], #hud[hidden] { display: none; }
    #spells .slot { position: relative; width: 62px; height: 46px; border: 2px solid var(--line); border-radius: 6px; background: rgba(15,19,27,.82); overflow: hidden; font-size: 11px; padding: 3px 5px; }
    #spells .slot.sel { border-color: var(--accent); background: rgba(23,32,47,.9); }
    #spells .slot.empty { opacity: .45; }
    #spells .key { position: absolute; right: 4px; top: 2px; color: var(--dim); }
    #spells .nm { display: block; font-weight: 600; }
    #spells .ch { display: block; color: var(--dim); font-variant-numeric: tabular-nums; }
    #spells .cd { position: absolute; left: 0; bottom: 0; width: 100%; height: 0; background: rgba(0,0,0,.55); }
    #spells .sw { position: absolute; left: 0; bottom: 0; width: 100%; height: 3px; border: 0; border-radius: 0; }
    canvas.dim { filter: brightness(.45) saturate(.7); }
    #death { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); pointer-events: none; font-size: 22px; font-weight: 700; color: #fff; text-shadow: 0 2px 6px #000; text-align: center; max-width: 90%; }
    #death[hidden] { display: none; }
    #toasts { position: absolute; left: 8px; top: 34px; display: flex; flex-direction: column; gap: 3px; pointer-events: none; max-width: calc(100% - 120px); }
    #toasts div { font-size: 12px; line-height: 1.2; padding: 3px 7px; border-radius: 4px; background: rgba(11,14,20,.78); color: #fff; align-self: flex-start; overflow-wrap: anywhere; transition: opacity .6s; }
    #toasts div.ach { background: rgba(60,45,8,.88); border: 1px solid #f0b429; color: #ffe29a; }
    #toasts div.fade { opacity: 0; }
    #bags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    #bags span { position: absolute; left: 0; top: 0; font-size: 11px; line-height: 1; padding: 1px 3px; border-radius: 3px; background: rgba(11,14,20,.75); color: #ffd98a; font-variant-numeric: tabular-nums; }
    @media (max-width: 480px) { #spells { gap: 3px; } #spells .slot { width: 56px; padding: 3px 4px; } #hud { bottom: 58px; } #death { font-size: 16px; } #toasts div { font-size: 11px; } }
    #minimap { position: absolute; left: 8px; right: 8px; top: 6px; height: 22px; background: rgba(15,19,27,.82); border: 1px solid var(--line); border-radius: 4px; cursor: pointer; touch-action: none; overflow: hidden; }
    #minimap[hidden], #who[hidden], #whoBtn[hidden] { display: none; }
    #minimap .dot { position: absolute; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: #e6e9f0; pointer-events: none; }
    #minimap .dot.me { width: 7px; height: 7px; margin: -3px 0 0 -3px; background: var(--accent); box-shadow: 0 0 0 1px #0b0e14; z-index: 1; }
    #minimap .dot.dead { background: #5b6174; }
    #minimap .view { position: absolute; top: 0; bottom: 0; border: 2px solid #ffd98a; border-top-width: 0; border-bottom-width: 0; pointer-events: none; }
    #whoBtn { position: absolute; right: 108px; top: 34px; height: 32px; font: inherit; font-size: 12px; color: var(--fg); background: rgba(15,19,27,.82); border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; cursor: pointer; }
    #who { position: absolute; right: 8px; top: 72px; width: min(240px, calc(100% - 16px)); max-height: 55%; overflow-y: auto; background: rgba(15,19,27,.94); border: 1px solid var(--line); border-radius: 6px; padding: 4px; z-index: 2; }
    #who button { display: flex; width: 100%; align-items: center; gap: 8px; min-height: 36px; font: inherit; font-size: 13px; color: var(--fg); background: none; border: 0; border-radius: 4px; padding: 4px 8px; text-align: left; cursor: pointer; }
    #who button:hover { background: #1b2231; }
    #who .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #who .st { font-size: 11px; color: var(--dim); }
    #who button.dead .nm { color: #7d8496; text-decoration: line-through; }
    #who .empty { color: var(--dim); font-size: 12px; padding: 6px 8px; }
    #join { position: fixed; inset: 0; z-index: 5; display: flex; overflow: auto; padding: 12px; box-sizing: border-box; align-items: center; justify-content: center; background: rgba(11,14,20,.88); }
    #join form { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; width: min(92vw, 340px); display: grid; gap: 12px; }
    #join[hidden] { display: none; }
    #join h2 { margin: 0; font-size: 17px; }
    #join p { margin: 0; color: var(--dim); font-size: 13px; }
    #join input { font: inherit; padding: 8px 10px; font-size: 16px; border-radius: 6px; border: 1px solid var(--line); background: #0f131b; color: var(--fg); }
    #join button { font: inherit; padding: 9px 12px; border-radius: 6px; border: 0; background: var(--accent); color: #0b0e14; font-weight: 600; cursor: pointer; }
    body.game footer { display: none; }
    body.game canvas { cursor: crosshair; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Game world</h1>
    <nav aria-label="World"><a id="navGame" href="/">Game</a><a id="navSandbox" href="/sandbox">Sandbox</a></nav>
    <a class="readme" href="/readme/">README</a>
    <span class="info" id="info">starting</span>
  </header>
  <main><div id="stage"></div></main>
  <div id="join" hidden>
    <form id="joinForm" autocomplete="off">
      <h2>Pick a name</h2>
      <p>Other players will see it. It stays in this browser; clear site data and you are someone new.</p>
      <input id="name" name="name" maxlength="24" placeholder="Your name" aria-label="Your name" />
      <button type="submit">Go</button>
    </form>
  </div>
  <div id="note" hidden></div>
  <footer>
    <div id="palette" role="group" aria-label="Material"></div>
    <label class="brush">Brush <input id="brush" type="range" min="1" max="16" value="4" /> <output id="brushOut">4</output></label>
  </footer>
  <script type="module" src="./main.ts"></script>
</body>
</html>
